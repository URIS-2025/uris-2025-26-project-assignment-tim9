name: CI - WorkPackageService

on:
  push:
    branches: [ feature/workpackage-service ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore WorkPackageService/WorkPackageService/WorkPackageService.csproj

      - name: Build
        run: dotnet build WorkPackageService/WorkPackageService/WorkPackageService.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test WorkPackageService/WorkPackageService.Tests/WorkPackageService.Tests.csproj --no-restore --configuration Release